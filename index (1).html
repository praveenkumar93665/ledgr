<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ledgr – Expense Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#121a2b;--mut:#6c7589;--line:#e6e9f0;--navy:#14213d;--amb:#fca311;--in:#0f9d74;--out:#e5484d;--soft:#eef0f6;--hero:#14213d;--heroT:#fff;--ac:#14213d;--acT:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0f1c;--card:#121a2d;--text:#eef1f8;--mut:#8b95ab;--line:#1f2a42;--in:#34d3a0;--out:#ff7b80;--soft:#1a2440;--hero:#1b2a4e;--ac:#fca311;--acT:#14213d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0f1c;--card:#121a2d;--text:#eef1f8;--mut:#8b95ab;--line:#1f2a42;--in:#34d3a0;--out:#ff7b80;--soft:#1a2440;--hero:#1b2a4e;--ac:#fca311;--acT:#14213d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:500 14px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:92px}
main{max-width:560px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
header h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.5px}
header small{color:var(--mut);display:block;font-weight:500}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;margin-left:6px}
h2{font-size:15px;margin:22px 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
h2 a{font-size:12px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:var(--hero);color:var(--heroT);border:0;padding:20px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;border:26px solid rgba(252,163,17,.22)}
.hero small{opacity:.7}.hero .big{font-size:36px;font-weight:800;letter-spacing:-1px;margin:2px 0 16px}
.hero .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:1}
.hero .two div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 12px}
.hero .two b{display:block;font-size:17px;margin-top:2px}
.in{color:var(--in)}.out{color:var(--out)}.mut{color:var(--mut)}
.hero .in{color:#5ff0c0}.hero .out{color:#ff9a9e}
.prog{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;border-radius:6px;transition:width .5s}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.chip small{color:var(--mut);display:block;font-size:11px}.chip b{font-size:15px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border:0}
.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--soft)}
.tx .m{flex:1;min-width:0}.tx .m b{display:block}.tx .m span{color:var(--mut);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .a{font-weight:700;text-align:right}
.day{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;font-weight:600;margin:16px 4px 6px}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:11px;font-weight:600}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.12)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:120px;border:0;background:none;color:var(--mut);padding:6px;border-radius:12px;font-size:11px;font-weight:600}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--text);background:var(--soft)}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));height:54px;padding:0 20px;border-radius:27px;border:0;background:var(--amb);color:#14213d;font-weight:800;font-size:15px;box-shadow:0 6px 18px rgba(252,163,17,.45);z-index:5}
.sheet{position:fixed;inset:0;background:rgba(5,10,25,.55);display:none;align-items:flex-end;z-index:9}
.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:94%;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:17px}
label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:0 0 5px 2px}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:600 16px inherit;margin-bottom:12px}
.amt{font-size:28px;font-weight:800;text-align:center}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.cats button{border:2px solid transparent;background:var(--card);color:var(--text);border-radius:14px;padding:9px 2px;font-size:11px;font-weight:600}
.cats button span{display:block;font-size:22px;margin-bottom:2px}
.cats button.on{border-color:var(--amb);background:var(--soft)}
.btn{width:100%;border:0;background:var(--ac);color:var(--acT);padding:15px;border-radius:14px;font-size:16px;font-weight:700}
.btn.g{background:none;color:var(--out);margin-top:6px}
.leg{display:flex;align-items:center;gap:10px;margin:11px 0}
.leg i{width:11px;height:11px;border-radius:4px;flex:none}
.leg span{flex:1}.leg small{color:var(--mut);margin-left:6px}
.dn{display:flex;justify-content:center;margin:4px 0 8px}
.cols{display:flex;align-items:flex-end;gap:8px;height:130px}
.cols div{flex:1;text-align:center;font-size:11px;color:var(--mut);font-weight:600}
.cols p{display:flex;justify-content:center;align-items:flex-end;gap:3px;margin:0 0 6px;height:105px}
.cols i{width:13px;border-radius:5px 5px 0 0;min-height:2px}
.pr{cursor:pointer;border:2px solid transparent}.pr.on{border-color:var(--amb)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.g3 small{color:var(--mut);display:block;font-size:11px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:#14213d;color:#fff;padding:11px 18px;border-radius:22px;display:none;z-index:10;font-weight:600}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" onclick="openForm()">＋ Add</button>
<nav id="nav"></nav>
<div class="sheet" id="sh" onclick="if(event.target===this)closeSh()"><div id="shb"></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const C={d:[['Fuel','⛽','#f59e0b'],['Recharge','📱','#3b82f6'],['Food','🍔','#ef4444'],['Shopping','🛍️','#ec4899'],['Bills','💡','#eab308'],['Rent','🏠','#8b5cf6'],['Travel','🚌','#06b6d4'],['Health','💊','#10b981'],['Education','📚','#6366f1'],['Fun','🎬','#f97316'],['EMI / Loan','🏦','#64748b'],['Other','🧾','#94a3b8']],
c:[['Salary','💰'],['Business','🏪'],['Freelance','💻'],['Gift','🎁'],['Refund','↩️'],['Other','➕']]};
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let S={tx:[],budget:0,open:0,theme:''};
try{const r=localStorage.getItem('ledgr');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(S.theme)document.documentElement.dataset.theme=S.theme;
const save=()=>{try{localStorage.setItem('ledgr',JSON.stringify(S))}catch(e){}};
let view='home',tf='all',q='',per='month',sel=null,f={},delArm=false,tm;
const p=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
const dt=s=>new Date(s+'T00:00:00');
const fmt=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const info=(t,c)=>C[t].find(x=>x[0]===c)||C[t][C[t].length-1];
const dl=s=>{const d=dt(s);return d.getDate()+' '+M[d.getMonth()]+' '+d.getFullYear()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>iso(new Date());
function key(s,pr){const d=dt(s);if(pr==='year')return''+d.getFullYear();if(pr==='month')return d.getFullYear()+'-'+p(d.getMonth()+1);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)}
function range(k,pr){let a,b;if(pr==='year'){a=new Date(+k,0,1);b=new Date(+k,11,31)}else if(pr==='month'){const[y,m]=k.split('-');a=new Date(+y,m-1,1);b=new Date(+y,+m,0)}else{a=dt(k);b=new Date(a);b.setDate(b.getDate()+6)}return[a,b]}
function lab(k,pr){if(pr==='year')return k;if(pr==='month'){const[y,m]=k.split('-');return M[m-1]+' '+y}const[a,b]=range(k,pr);return a.getDate()+' '+M[a.getMonth()]+' – '+b.getDate()+' '+M[b.getMonth()]}
function nDays(k,pr){const[a,b]=range(k,pr),n=new Date(),e=b<n?b:n;return e<a?1:Math.round((e-a)/864e5)+1}
function sum(l){let i=0,o=0;l.forEach(x=>x.t==='c'?i+=x.amt:o+=x.amt);return{i,o}}
function brk(l){const m={};l.filter(x=>x.t==='d').forEach(x=>m[x.cat]=(m[x.cat]||0)+x.amt);return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function dayName(s){const t=today(),y=new Date();y.setDate(y.getDate()-1);return s===t?'Today':s===iso(y)?'Yesterday':dl(s)}
const sorted=()=>[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));

function donut(l){const b=brk(l);if(!b.length)return'<div class="empty">No expenses yet for this period.</div>';
const tot=b.reduce((s,x)=>s+x[1],0),R=52,CF=2*Math.PI*R;let off=0;
const arcs=b.map(([c,v])=>{const len=v/tot*CF,s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${info('d',c)[2]}" stroke-width="20" stroke-dasharray="${Math.max(len-2,0.5)} ${CF}" stroke-dashoffset="${-off}"/>`;off+=len;return s}).join('');
return`<div class="dn"><svg width="190" height="190" viewBox="0 0 140 140"><g transform="rotate(-90 70 70)">${arcs}</g><text x="70" y="66" text-anchor="middle" font-size="9" fill="var(--mut)">Spent</text><text x="70" y="82" text-anchor="middle" font-size="15" font-weight="800" fill="var(--text)">${fmt(tot)}</text></svg></div>`+
b.map(([c,v])=>`<div class="leg"><i style="background:${info('d',c)[2]}"></i><span>${info('d',c)[1]} ${c}</span><b>${fmt(v)}</b><small>${Math.round(v/tot*100)}%</small></div>`).join('')}

function rows(l){return l.map(x=>{const i=info(x.t,x.cat);return`<div class="tx" onclick="openForm('${x.id}')"><div class="ic">${i[1]}</div><div class="m"><b>${x.cat}</b><span>${x.note?esc(x.note)+' · ':''}${dl(x.date)}</span></div><div class="a ${x.t==='c'?'in':'out'}">${x.t==='c'?'+':'−'}${fmt(x.amt)}</div></div>`}).join('')}

function home(){const all=sum(S.tx),bal=S.open+all.i-all.o,mk=key(today(),'month'),ml=S.tx.filter(x=>key(x.date,'month')===mk),m=sum(ml),b=brk(ml);
const rate=m.i>0?Math.round((m.i-m.o)/m.i*100)+'%':'–',avg=m.o/nDays(mk,'month');
let bud;if(S.budget>0){const pc=m.o/S.budget*100,col=pc>100?'var(--out)':pc>80?'var(--amb)':'var(--in)';
bud=`<div class="card"><div style="display:flex;justify-content:space-between"><b>Monthly budget</b><span class="mut">${fmt(S.budget)}</span></div><div class="prog"><i style="width:${Math.min(pc,100)}%;background:${col}"></i></div><div style="display:flex;justify-content:space-between"><span>${fmt(m.o)} spent</span><b class="${pc>100?'out':''}">${S.budget-m.o>=0?fmt(S.budget-m.o)+' left':fmt(m.o-S.budget)+' over'}</b></div></div>`}
else bud=`<div class="card" onclick="openSet()" style="cursor:pointer"><b>Set a monthly budget</b><div class="mut">Track how much you can still spend this month.</div></div>`;
return`<div class="card hero"><small>Total balance</small><div class="big">${fmt(bal)}</div><div class="two"><div><small>Income · ${M[new Date().getMonth()]}</small><b class="in">${fmt(m.i)}</b></div><div><small>Expenses · ${M[new Date().getMonth()]}</small><b class="out">${fmt(m.o)}</b></div></div></div>
${bud}<div class="chips"><div class="chip"><small>Saved</small><b>${fmt(m.i-m.o)}</b></div><div class="chip"><small>Savings rate</small><b>${rate}</b></div><div class="chip"><small>Daily avg</small><b>${fmt(avg)}</b></div></div>
<h2>Spending by category</h2><div class="card">${donut(ml)}</div>
<h2>Recent transactions<a onclick="go('list')">See all</a></h2><div class="card" style="padding:4px 16px">${rows(sorted().slice(0,5))||'<div class="empty">No transactions yet. Tap Add to record your first one.</div>'}</div>`}

function list(){let l=sorted();if(tf!=='all')l=l.filter(x=>x.t===tf);const s=q.toLowerCase();if(s)l=l.filter(x=>(x.cat+' '+x.note).toLowerCase().includes(s));
const g={};l.forEach(x=>(g[x.date]=g[x.date]||[]).push(x));
const h=Object.keys(g).map(d=>{const t=sum(g[d]);return`<div class="day"><span>${dayName(d)}</span><span>${t.i?'<span class="in">+'+fmt(t.i)+'</span> ':''}${t.o?'<span class="out">−'+fmt(t.o)+'</span>':''}</span></div><div class="card" style="padding:4px 16px">${rows(g[d])}</div>`}).join('');
return`<input id="q" placeholder="Search transactions…" value="${esc(q)}" oninput="q=this.value;render(1)" style="margin-bottom:10px"><div class="seg">${[['all','All'],['c','Income'],['d','Expenses']].map(([k,n])=>`<button class="${tf===k?'on':''}" onclick="tf='${k}';render()">${n}</button>`).join('')}</div>${h||'<div class="empty">No transactions found.</div>'}`}

function report(){const g={};S.tx.forEach(x=>{const k=key(x.date,per);(g[k]=g[k]||[]).push(x)});
const ks=Object.keys(g).sort().reverse();if(!ks.includes(sel))sel=ks[0]||null;
const last=ks.slice(0,6).reverse(),mx=Math.max(1,...last.map(k=>{const s=sum(g[k]);return Math.max(s.i,s.o)}));
const chart=last.length?`<div class="card"><div class="cols">${last.map(k=>{const s=sum(g[k]);return`<div><p><i style="height:${s.i/mx*100}px;background:var(--in)"></i><i style="height:${s.o/mx*100}px;background:var(--out)"></i></p>${per==='week'?dt(k).getDate()+' '+M[dt(k).getMonth()]:per==='month'?M[k.split('-')[1]-1]:k}</div>`}).join('')}</div><div class="mut" style="margin-top:10px"><span class="in">●</span> Income &nbsp; <span class="out">●</span> Expenses</div></div>`:'';
let det='';if(sel){const l=g[sel],s=sum(l),b=brk(l);det=`<h2>${lab(sel,per)}</h2><div class="card"><div class="g3"><div><small>Income</small><b class="in">${fmt(s.i)}</b></div><div><small>Spent</small><b class="out">${fmt(s.o)}</b></div><div><small>Saved</small><b>${fmt(s.i-s.o)}</b></div></div><div class="g3" style="border-top:1px solid var(--line);padding-top:10px"><div><small>Savings rate</small><b>${s.i>0?Math.round((s.i-s.o)/s.i*100)+'%':'–'}</b></div><div><small>Daily avg</small><b>${fmt(s.o/nDays(sel,per))}</b></div><div><small>Top category</small><b>${b[0]?info('d',b[0][0])[1]+' '+b[0][0]:'–'}</b></div></div></div><div class="card">${donut(l)}</div>`}
const all=ks.map(k=>{const s=sum(g[k]);return`<div class="card pr ${k===sel?'on':''}" onclick="sel='${k}';render();scrollTo(0,0)"><b>${lab(k,per)}</b><div class="g3"><div><small>Income</small><b class="in">${fmt(s.i)}</b></div><div><small>Spent</small><b class="out">${fmt(s.o)}</b></div><div><small>Saved</small><b>${fmt(s.i-s.o)}</b></div></div></div>`}).join('');
return`<div class="seg">${[['week','Weekly'],['month','Monthly'],['year','Yearly']].map(([k,n])=>`<button class="${per===k?'on':''}" onclick="per='${k}';sel=null;render()">${n}</button>`).join('')}</div>${chart}${det}${all?'<h2>All periods</h2>'+all:'<div class="empty">Add transactions to see reports.</div>'}`}

function render(keep){const a=$('#app'),fo=keep&&document.activeElement&&document.activeElement.id==='q';
a.innerHTML=`<header><div><h1>Ledgr</h1><small>${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</small></div><div><button class="ib" onclick="toggleTheme()" aria-label="Theme">◐</button><button class="ib" onclick="openSet()" aria-label="Settings">⚙</button></div></header>`+(view==='home'?home():view==='list'?list():report());
if(fo){const i=$('#q');i.focus();i.setSelectionRange(q.length,q.length)}
$('#nav').innerHTML=[['home','🏠','Home'],['list','🧾','Transactions'],['rep','📈','Reports']].map(([k,i,n])=>`<button class="${view===k?'on':''}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('')}
function go(v){view=v;render();scrollTo(0,0)}
function toggleTheme(){const d=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()==='#0a0f1c';S.theme=d?'light':'dark';document.documentElement.dataset.theme=S.theme;save()}

function openForm(id){delArm=false;const x=id&&S.tx.find(t=>t.id===id);f=x?{...x,amt:String(x.amt),edit:1}:{t:'d',cat:'Fuel',date:today(),amt:'',note:''};drawForm();$('#sh').classList.add('show')}
function closeSh(){$('#sh').classList.remove('show')}
function drawForm(){$('#shb').innerHTML=`<h3>${f.edit?'Edit transaction':'New transaction'}</h3><div class="seg"><button class="${f.t==='d'?'on':''}" onclick="setT('d')">Expense</button><button class="${f.t==='c'?'on':''}" onclick="setT('c')">Income</button></div>
<label>Amount (₹)</label><input id="amt" class="amt" type="number" inputmode="decimal" placeholder="0" value="${f.amt}" oninput="f.amt=this.value">
<label>Category</label><div class="cats">${C[f.t].map(([n,i])=>`<button class="${f.cat===n?'on':''}" onclick="f.cat='${n}';drawForm()"><span>${i}</span>${n}</button>`).join('')}</div>
<label>Date</label><input type="date" value="${f.date}" oninput="f.date=this.value">
<label>${f.t==='c'?'Received from':'Note'} (optional)</label><input placeholder="${f.t==='c'?'e.g. Company, client, friend':'e.g. Petrol pump, groceries'}" value="${esc(f.note||'')}" oninput="f.note=this.value">
<button class="btn" onclick="saveTx()">${f.edit?'Update':'Save'} transaction</button>${f.edit?`<button class="btn g" onclick="delTx()">${delArm?'Tap again to confirm delete':'Delete transaction'}</button>`:''}`}
function setT(t){f.t=t;f.cat=C[t][0][0];drawForm()}
function saveTx(){const a=parseFloat(f.amt);if(!(a>0))return toast('Enter a valid amount');if(!f.date)return toast('Select a date');
const o={id:f.id||Date.now().toString(36),t:f.t,amt:a,date:f.date,cat:f.cat,note:(f.note||'').trim()};
if(f.edit)S.tx=S.tx.map(x=>x.id===o.id?o:x);else S.tx.push(o);save();closeSh();render();toast(f.edit?'Transaction updated':'Transaction saved')}
function delTx(){if(!delArm){delArm=true;return drawForm()}S.tx=S.tx.filter(x=>x.id!==f.id);save();closeSh();render();toast('Transaction deleted')}

function openSet(){delArm=false;drawSet();$('#sh').classList.add('show')}
function drawSet(){$('#shb').innerHTML=`<h3>Settings</h3><label>Monthly budget (₹)</label><input id="bd" type="number" inputmode="decimal" placeholder="e.g. 25000" value="${S.budget||''}"><label>Opening balance (₹)</label><input id="ob" type="number" inputmode="decimal" placeholder="Money you already have" value="${S.open||''}"><button class="btn" onclick="saveSet()">Save settings</button><button class="btn g" onclick="resetAll()">${delArm?'Tap again to erase everything':'Erase all data'}</button>`}
function saveSet(){S.budget=parseFloat($('#bd').value)||0;S.open=parseFloat($('#ob').value)||0;save();closeSh();render();toast('Settings saved')}
function resetAll(){if(!delArm){delArm=true;return drawSet()}S.tx=[];S.budget=0;S.open=0;save();closeSh();render();toast('All data erased')}
function toast(h){const t=$('#toast');t.textContent=h;t.style.display='block';clearTimeout(tm);tm=setTimeout(()=>t.style.display='none',1800)}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
